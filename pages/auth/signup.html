<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="icon" type="image/png" href="/assets/img/Logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <style>
        html{
            height: 100%;
        }
        body{
            font-family: "Space Grotesk", sans-serif;
            font-weight: 300;
            font-size: large;
            margin: 0;
            min-height: 100vh;
            color: white;
            background: 
                radial-gradient(circle at 20% 20%, rgb(90, 12, 110) 0%, rgb(38, 5, 74) 45%, rgb(14, 5, 28) 100%),
                url("./galaxy.png");
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .form{
            width: calc(100% - 2.5rem);
            max-width: 24rem;
            margin: 4rem auto;
            padding: 2rem 1.75rem;
            background-color: rgb(49, 0, 122);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(89, 17, 255, .45);
            backdrop-filter: blur(8px);
        }
        .form .logo{
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 1rem;
        }
        .form .logo img{
            width: 60px;
            height: 60px;
            object-fit: contain;
        }
        .form .logo h3{
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.1;
        }
        .form .logo h3:first-child{
            color: #22d3ee;
        }
        .text-title{
            margin: 0 0 1.5rem 0;
            font-size: 1.5rem;
        }
        .form form{
            display: grid;
            grid-template-columns: auto 1fr;
            align-items: center;
        }
        .form form br{
            display: none;
        }
        .form label{
            grid-column: 1 / -1;
            margin: 0 0 .4rem .25rem;
            font-family: inherit;
            font-size: .9rem;
            color: #c9c3e6;
        }
        .form form i:not(.toggle-password){
            display: grid;
            place-items: center;
            box-sizing: border-box;
            width: 2.75rem;
            align-self: stretch;
            margin-bottom: 1.1rem;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .18);
            border-right: 0;
            border-radius: 999px 0 0 999px;
            color: #22d3ee;
        }
        .form input{
            box-sizing: border-box;
            width: 100%;
            min-width: 0;
            margin-bottom: 1.1rem;
            padding: .8rem 1rem .8rem .25rem;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .18);
            border-left: 0;
            border-radius: 0 999px 999px 0;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
        }
        .form input::placeholder{
            color: #9d96c4;
        }
        .form input:focus{
            border-color: rgba(255, 255, 255, .18);
            box-shadow: none;
        }
        .input-wrapper{
            grid-column: 2;
            position: relative;
            width: 100%;
            margin-bottom: 1.1rem;
            display: flex;
            align-items: center;
        }
        .input-wrapper input{
            margin-bottom: 0 !important;
            padding-right: 2.75rem !important;
            border-top-right-radius: 999px !important;
            border-bottom-right-radius: 999px !important;
            border-right: 1px solid rgba(255, 255, 255, .18) !important;
        }
        .toggle-password{
            position: absolute;
            right: 1rem;
            cursor: pointer;
            color: #c9c3e6;
            font-size: 1rem;
            z-index: 3;
            background: none !important;
            border: none !important;
            box-shadow: none !important;
            width: auto !important;
            height: auto !important;
            margin: 0 !important;
            display: inline-block !important;
            transition: color 0.3s ease;
        }
        .toggle-password:hover{
            color: #22d3ee;
        }
        .form button{
            grid-column: 1 / -1;
            padding: .8rem 1.1rem;
            background: linear-gradient(135deg, #5911ff, #a855f7);
            color: #fff;
            border: 0;
            border-radius: 999px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform .3s ease, box-shadow .3s ease, filter .3s ease;
        }
        .form button:hover,
        .form button:focus-visible{
            box-shadow: 0 0 30px #5911ff;
            filter: brightness(1.2);
        }
        @media (prefers-reduced-motion: no-preference){
            .form button:hover,
            .form button:focus-visible { transform: scale(1.03); }
        }
        .form form > br + button{
            margin-top: .5rem;
        }
        .form > p {
            margin: 1.5rem 0 0;
            text-align: center;
            font-size: .9rem;
            color: #c9c3e6;
        }
        .form > p a {
            color: #22d3ee;
            font-weight: 700;
            text-decoration: none;
        }
        .form > p a:hover,
        .form > p a:focus-visible{
            text-decoration: underline;
        }
        @media (max-width: 768px){
            .form{
                width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="form">
        <div class="logo">
            <img src="/assets/img/Logo.png" alt="logo">
            <div>
                <h3>SornDoang</h3>
                <h3>Store</h3>
            </div>
        </div>
        <h3 class="text-title">Sign up</h3>
        <form action="">
            <label>Enter your email</label><br>
            <i class="fa-regular fa-user"></i>
            <input type="email" name="Email" placeholder="Email" required> <br>
            <label>Enter your password</label><br>
            <i class="fa-solid fa-lock"></i>
            <div class="input-wrapper">
                <input type="password" id="password" name="password" placeholder="Password" required>
                <i class="fa-regular fa-eye toggle-password" data-target="password"></i>
            </div>
            <br>
            <label>Confirm your password</label><br>
            <i class="fa-solid fa-lock"></i>
            <div class="input-wrapper">
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required>
                <i class="fa-regular fa-eye toggle-password" data-target="confirm_password"></i>
            </div>
            <br>
            <button type="submit">Sign up</button>
        </form>
        <p>Already have an account?
            <span>
                <a href="./signin.html">Login</a>
            </span>
        </p>
    </div>
    <script>
        const toggles = document.querySelectorAll('.toggle-password');
        toggles.forEach(toggle => {
            toggle.addEventListener('click', function () {
                const targetId = this.getAttribute('data-target');
                const passwordInput = document.getElementById(targetId);
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                this.classList.toggle('fa-eye');
                this.classList.toggle('fa-eye-slash');
            });
        });
    </script>
</body>
</html>
